version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./server
    ports: ["5000:5000"]
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai:8000
      - CLIENT_URL=http://localhost:5173
    depends_on: [redis]
  ai:
    build: ./ai-agents
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
  web:
    build: ./client
    ports: ["5173:5173"]
    depends_on: [api, ai]
