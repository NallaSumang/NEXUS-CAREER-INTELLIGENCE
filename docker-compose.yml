version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./server
    ports: ["5000:5000"]
    env_file: .env
    depends_on: [redis]
  ai:
    build: ./ai-agents
    ports: ["8000:8000"]
    env_file: .env
  web:
    build: ./client
    ports: ["5173:5173"]
    depends_on: [api, ai]
